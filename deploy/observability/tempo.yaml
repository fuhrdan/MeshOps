apiVersion: v1
kind: ConfigMap
metadata: { name: tempo-config, namespace: meshops }
data:
  tempo.yaml: |
    server: { http_listen_port: 3200 }
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
            http: { endpoint: 0.0.0.0:4318 }
    ingester: { max_block_duration: 5m }
    compactor: { compaction: { block_retention: 24h } }
    storage:
      trace:
        backend: local
        wal: { path: /var/tempo/wal }
        local: { path: /var/tempo/blocks }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: meshops
  labels: { app: tempo, app.kubernetes.io/component: tracing }
spec:
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata: { labels: { app: tempo } }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.8.2
          args: ["-config.file=/conf/tempo.yaml"]
          ports: [{ name: http, containerPort: 3200 }, { name: otlp-grpc, containerPort: 4317 }]
          volumeMounts: [{ name: config, mountPath: /conf }, { name: data, mountPath: /var/tempo }]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: tempo, namespace: meshops }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
