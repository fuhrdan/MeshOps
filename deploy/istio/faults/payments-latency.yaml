apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: meshops-fault-payments-latency
  namespace: meshops
  labels:
    app.kubernetes.io/part-of: meshops
    app.kubernetes.io/component: incident-fault
    meshops.dev/fault-id: payments-latency
spec:
  hosts:
    - payments
  http:
    - fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 650ms
      route:
        - destination:
            host: payments
            port:
              number: 8080
