apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog-versions
  namespace: meshops
  labels:
    app.kubernetes.io/component: traffic-policy
spec:
  host: catalog
  subsets:
    - name: stable
      labels: { version: stable }
    - name: canary
      labels: { version: canary }
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog-canary
  namespace: meshops
  labels:
    app.kubernetes.io/component: traffic-policy
spec:
  hosts: [catalog]
  http:
    - route:
        - destination: { host: catalog, subset: stable, port: { number: 8080 } }
          weight: 90
        - destination: { host: catalog, subset: canary, port: { number: 8080 } }
          weight: 10
