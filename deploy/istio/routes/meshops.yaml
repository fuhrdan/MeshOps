apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meshops
  namespace: meshops
  labels:
    app.kubernetes.io/part-of: meshops
spec:
  parentRefs:
    - name: meshops-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/telemetry
      backendRefs:
        - name: ops-telemetry
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-gateway
          port: 8080
